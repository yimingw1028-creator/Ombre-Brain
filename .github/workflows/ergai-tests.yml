name: 二改测试

# 这是我们自己的工作流（二改），上游没有。说明见根目录 二改记录.md 的「关于测试」。
#
# 做什么：每次往 main 推了代码或测试，用锁文件里的真实依赖把完整测试跑一遍。
# 怎么看：提交旁边的绿勾 = 全过；红叉 = 没过。没过时会在那次提交下面留一条评论，
#         列出是哪些测试失败了，不用点进日志。
# 只改 二改记录.md 或 二改/ 里的文件时不会触发。

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'deploy/**'
      - 'tools/**'
      - 'update_manifest.json'
      - 'requirements*'
      - '.github/workflows/ergai-tests.yml'
  workflow_dispatch:

permissions:
  contents: write   # 只用来在失败时给提交留评论

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 准备 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装锁文件里的依赖
        run: |
          python -m pip install "uv==0.11.23"
          uv pip sync requirements-dev.lock.txt --require-hashes --system

      - name: 和 Dockerfile 一样单独升级的两个包
        run: python -m pip install --upgrade "certifi>=2026.10.19" "pyjwt>=2.14.0"

      - name: 静态检查
        run: |
          set -o pipefail
          ruff check src tools deploy tests --no-cache 2>&1 | tee ruff.log

      - name: 完整测试
        # 下面排除的 5 个测试函数（6 条用例）是上游 2.17.1 自带的失败，不是二改造成的：
        # 上游提交 499e839 把 letter_lock_update / letter_write 的返回从 JSON 改成了一句话，
        # 没有同步改这几条测试，它们还在用 json.loads 去读返回。2026-11-16 在没动过的
        # 上游 2.17.1 上跑过，同样是这 6 条失败。
        # 这份名单不许再加。想加之前先问 June（见 二改记录.md 的硬规则）。
        run: |
          set -o pipefail
          python -m pytest tests -q --asyncio-mode=auto -p no:cacheprovider -rfE \
            --deselect "tests/test_letter_time_lock.py::test_mcp_creates_locked_letter_owned_by_ai_without_echoing_content" \
            --deselect "tests/test_letter_time_lock.py::test_lock_owner_can_change_every_supported_transition_without_editing_original" \
            --deselect "tests/test_letter_time_lock.py::test_ai_owner_can_relock_public_letter_through_multiple_cycles" \
            --deselect "tests/test_letter_time_lock.py::test_expired_timed_letter_keeps_owner_and_can_be_locked_again" \
            --deselect "tests/test_letter_time_lock.py::test_dashboard_converts_historical_letter_to_ai_owned_lockable_format" \
            2>&1 | tee pytest.log

      - name: 没过的时候，把结果写到提交下面
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "二改测试没有通过（提交 ${GITHUB_SHA::7}）。"
            echo
            echo '```'
            if [ -f pytest.log ]; then
              grep -E "^(FAILED|ERROR) " pytest.log | cut -c1-300 | head -150
              tail -n 3 pytest.log
            elif [ -f ruff.log ]; then
              echo "静态检查没过："
              tail -n 60 ruff.log | cut -c1-300
            else
              echo "没跑到检查那一步：装依赖的时候就失败了。"
            fi
            echo '```'
          } > comment.md
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@comment.md
